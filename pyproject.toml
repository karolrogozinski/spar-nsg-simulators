[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsg-sim"
version = "0.1.0"
description = "Datasets and experiments for simulator-based evaluation of explanation faithfulness (NSG)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "openai",
    "python-dotenv",
    "huggingface_hub",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nsg = "nsg_sim.cli:main"

[tool.setuptools.packages.find]
include = ["nsg_sim*"]

[tool.setuptools.package-data]
"nsg_sim.prompts" = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
