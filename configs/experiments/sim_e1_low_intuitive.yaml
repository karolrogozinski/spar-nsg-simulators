# E1 pilot, step 1: gpt-oss-20b at low reasoning on the intuitive twin. The same cases are sampled in all
# three twins (same seed, same record ids), so results compare record by record.
name: sim_e1_low_intuitive
dataset: triage_sim_v1
sample: {per_cell: 8, seed: 0}
simulators:
  - {backend: openrouter, model: "openai/gpt-oss-20b", reasoning_effort: low, label: gpt-oss-20b@low}
run: {concurrency: 8, max_tokens: 4096, max_requests: 2500}
