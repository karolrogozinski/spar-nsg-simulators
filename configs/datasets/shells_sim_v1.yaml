# EXP-011 generalisation: the triage_sim_v2 recipe in the `shells` domain (invented species: no priors; directions arbitrary).
# Neutral features stay out of the rules, like demographics in triage. Twins: shells_sim_counter_v1
# (mirror) and shells_sim_abstract_v1 (abstract), identical labels record by record.
name: shells_sim_v1
description: 16 intuitive sampled shells rules (3-5 conditions); faithful and omission (1 or 2 conditions) at P0-P3; exact balance.
domain: shells
seed: 0
rule_sampler:
  n_rules: 16
  n_conditions: [3, 5]
  connectors: {and: 3, or: 1, unless: 1, at_least: {weight: 1, k: [2, 3]}}
  max_depth: 2
  direction: intuitive
  features: {exclude: [collector]}
  rule_yes_rate: [0.25, 0.75]
explanations:
  types: [faithful, omission]
  omission: {n: [1, 2]}
counterfactuals: {n_reference: 4, n_per_reference: 8, balance: exact}
